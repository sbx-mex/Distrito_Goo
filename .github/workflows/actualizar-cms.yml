name: Actualizar CMS desde Excel

on:
  push:
    branches: [main]
    paths:
      - "Distrito_Go_CMS_v2_actualizado.xlsx"
      - "cms-contract.json"
      - "assets/photos/**"
      - "assets/premium/duty-roster/**"
      - "tools/cms_pipeline.py"
      - "tools/cms_release.py"
      - "tools/build_data.py"
      - "tools/validate_cms.py"
      - "tools/validate_cms_sync.py"
      - ".github/workflows/actualizar-cms.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-cms-distrito-goo
  cancel-in-progress: false

jobs:
  publicar:
    name: Compilar, reconciliar y publicar
    if: github.repository == 'sbx-mx/Distrito_Goo' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci
      - name: Publicación transaccional
        run: python tools/cms_release.py Distrito_Go_CMS_v2_actualizado.xlsx --project .
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-release-${{ github.run_number }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Comprobar alcance
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(data/.*\.json|reports/.*\.json|assets/photos/.*\.webp|assets/premium/duty-roster/.*\.webp)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "El generador intentó modificar rutas no autorizadas:"
            echo "$unexpected"
            exit 1
          fi
      - name: Publicar datos aprobados
        shell: bash
        run: |
          set -euo pipefail
          git add data/*.json assets/photos/*.webp assets/premium/duty-roster/*.webp
          if git diff --cached --quiet; then
            echo "CMS válido; no hubo cambios de datos." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar datos desde Excel CMS"
          git push
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open('data/cms-build.v1.json', encoding='utf-8'))
          print('## CMS publicado')
          print(f"- Registros: {data['records']}")
          print(f"- Pestañas: {len(data['sheets'])}")
          print(f"- SHA Excel: `{data['sourceSha256'][:12]}`")
          PY
