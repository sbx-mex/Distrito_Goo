name: Validar calidad integral

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "modules/**"
      - "styles/**"
      - "data/**"
      - "assets/**"
      - "Distrito_Go_CMS_v2_actualizado.xlsx"
      - "tools/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-distrito-goo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: CMS, navegación, accesibilidad y PWA
    if: github.repository == 'sbx-mx/Distrito_Goo'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validar sintaxis
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/*.py
          find modules -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Ejecutar control integral
        run: python tools/quality_gate.py --report reports/quality-gate.json

      - name: Ejecutar pruebas de experiencia
        shell: bash
        run: |
          node tools/test_experience_v37.mjs --report reports/v42-compatibility.json
          node tools/test_enhancements_v42.mjs --report reports/v42-enhancements.json

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calidad-distrito-goo-${{ github.run_number }}
          path: |
            reports/quality-gate.json
            reports/v42-compatibility.json
            reports/v42-enhancements.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resumen
        if: always()
        shell: bash
        run: |
          if [ -f reports/quality-gate.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("reports/quality-gate.json", encoding="utf-8"))
          summary = report["summary"]
          print("## Control integral Distrito Go")
          print(f"- Estado: {'APROBADO' if report['ok'] else 'RECHAZADO'}")
          print(f"- Controles aprobados: {summary['passed']}/{summary['total']}")
          print(f"- Errores críticos: {summary['failed']}")
          print(f"- Advertencias: {summary['warnings']}")
          PY
          fi
