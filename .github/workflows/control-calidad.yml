name: Calidad integral

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "Distrito_Go_CMS_v2_actualizado.xlsx"
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-distrito-goo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: CMS, PWA, eventos, imágenes y navegación
    if: github.repository == 'sbx-mx/Distrito_Goo' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci
      - name: Validar versión completa en aislamiento
        run: python tools/cms_release.py Distrito_Go_CMS_v2_actualizado.xlsx --project . --skip-mutation-test
      - name: Probar edición de ID y celda sin efectos colaterales
        run: python tools/validate_cms_sync.py Distrito_Go_CMS_v2_actualizado.xlsx --project . --mutation-test --report reports/cms-sync-mutation.json
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calidad-${{ github.run_number }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
