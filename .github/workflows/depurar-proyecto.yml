name: Depurar archivos sin uso

on:
  schedule:
    - cron: "40 12 * * 1"
  workflow_dispatch:
    inputs:
      accion:
        description: "Auditar o eliminar archivos huérfanos comprobados"
        required: true
        default: AUDITAR
        type: choice
        options: [AUDITAR, ELIMINAR]
      confirmacion:
        description: "Para eliminar escribe ELIMINAR_ARCHIVOS_HUERFANOS"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: depurar-distrito-go
  cancel-in-progress: false

jobs:
  depurar:
    if: github.repository == 'sbx-mx/Distrito_Goo'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCION: ${{ inputs.accion || 'AUDITAR' }}
      CONFIRMACION: ${{ inputs.confirmacion || '' }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci
      - name: Auditar referencias reales
        run: python tools/cleanup_unused.py --report audit-unused-files.json
      - name: Resumir auditoría
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report=json.load(open('audit-unused-files.json', encoding='utf-8'))
          print('## Depuración segura')
          print(f"- Candidatos comprobados: {report['summary']['candidates']}")
          print('- Modo programado: solo auditoría')
          for item in report['candidates'][:30]:
              print(f"- `{item['path']}` — {item['reason']}")
          PY
      - name: Validar autorización manual
        if: env.ACCION == 'ELIMINAR'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMACION" = "ELIMINAR_ARCHIVOS_HUERFANOS"
      - name: Eliminar candidatos confirmados
        if: env.ACCION == 'ELIMINAR'
        run: python tools/cleanup_unused.py --apply --confirm ELIMINAR_ARCHIVOS_HUERFANOS --report audit-unused-files.json
      - name: Validar aplicación después de eliminar
        if: env.ACCION == 'ELIMINAR'
        run: python tools/cms_release.py Distrito_Go_CMS_v2_actualizado.xlsx --project . --skip-mutation-test
      - name: Volver a retirar reportes regenerados
        if: env.ACCION == 'ELIMINAR'
        run: python tools/cleanup_unused.py --apply --confirm ELIMINAR_ARCHIVOS_HUERFANOS --report audit-unused-files.json
      - name: Preparar exclusivamente eliminaciones
        if: env.ACCION == 'ELIMINAR'
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- assets modules styles tools reports .github/workflows
          if git diff --cached --diff-filter=ACMR --quiet; then
            exit 0
          fi
          echo "La depuración intentó agregar o modificar archivos; se canceló por seguridad."
          git diff --cached --name-status
          exit 1
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depuracion-${{ github.run_number }}
          path: audit-unused-files.json
          if-no-files-found: warn
          retention-days: 30
      - name: Registrar limpieza
        if: env.ACCION == 'ELIMINAR'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No existen archivos huérfanos por eliminar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Depurar archivos sin uso comprobado"
          git push
