name: Distrito Go - validar, optimizar y mantener

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: distrito-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: CMS, interfaz, navegación y limpieza
    if: github.repository == 'sbx-mx/Distrito_Goo' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci

      - name: Auditar y limpiar obsoletos en el runner
        shell: bash
        run: |
          set -euo pipefail
          python tools/cleanup_unused.py \
            --apply \
            --confirm ELIMINAR_ARCHIVOS_HUERFANOS \
            --report reports/unused-files.json

      - name: Compilar, auditar y publicar el CMS transaccionalmente
        shell: bash
        run: |
          set -euo pipefail
          python tools/cms_release.py Distrito_Go_CMS_v2_actualizado.xlsx --project . --skip-mutation-test

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar sitio local
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/distrito-go-http.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/distrito-go-http.log"
          exit 1

      - name: Probar navegación real
        env:
          DISTRITO_GO_TEST_DATE: "2026-08-14"
        run: npm run test:navigation

      - name: Conservar auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-distrito-go-${{ github.run_number }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar datos y limpieza aprobados
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- data assets modules styles tools .github/workflows
          if git diff --cached --quiet; then
            echo "Proyecto validado; no hay cambios por publicar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimizar y validar Distrito Go"
          git push origin "HEAD:${GITHUB_REF_NAME}"
