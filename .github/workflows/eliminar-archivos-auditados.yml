name: Eliminar archivos auditados

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Escribe ELIMINAR_44_ELEMENTOS para confirmar"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: eliminar-archivos-auditados
  cancel-in-progress: false

jobs:
  eliminar:
    name: Eliminar únicamente las rutas aprobadas
    runs-on: ubuntu-latest
    if: ${{ inputs.confirmacion == 'ELIMINAR_44_ELEMENTOS' }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar lista y eliminar archivos
        shell: bash
        run: |
          set -euo pipefail

          lista="ARCHIVOS_A_ELIMINAR.txt"
          if [[ ! -f "$lista" ]]; then
            echo "::error::No existe $lista en la raíz del repositorio."
            exit 1
          fi

          mapfile -t rutas < <(
            awk '/^(\.github\/workflows|assets\/|tools\/|reports\/)/ { print }' "$lista" \
              | sed 's/\r$//' \
              | sort -u
          )

          if [[ "${#rutas[@]}" -ne 33 ]]; then
            echo "::error::Se esperaban 33 rutas explícitas y se detectaron ${#rutas[@]}."
            exit 1
          fi

          for ruta in "${rutas[@]}"; do
            if [[ "$ruta" = /* || "$ruta" == *".."* ]]; then
              echo "::error::Ruta insegura detectada: $ruta"
              exit 1
            fi

            case "$ruta" in
              .github/workflows/*|assets/*|tools/*|reports/*) ;;
              *)
                echo "::error::Ruta fuera del alcance autorizado: $ruta"
                exit 1
                ;;
            esac
          done

          printf '%s\n' "${rutas[@]}" > /tmp/rutas_a_eliminar.txt
          printf '%s\n' "tools/__pycache__/" >> /tmp/rutas_a_eliminar.txt

          while IFS= read -r ruta; do
            git rm -r --ignore-unmatch -- "$ruta"
          done < /tmp/rutas_a_eliminar.txt

          while IFS= read -r ruta; do
            if [[ -e "$ruta" ]]; then
              echo "::error::No se pudo eliminar: $ruta"
              exit 1
            fi
          done < /tmp/rutas_a_eliminar.txt

      - name: Confirmar cambios
        id: cambios
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "No quedan archivos auditados por eliminar."
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
            git diff --cached --name-status
          fi

      - name: Registrar limpieza
        if: steps.cambios.outputs.hay_cambios == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: eliminar archivos auditados sin uso"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Resumen
        if: always()
        shell: bash
        run: |
          {
            echo "## Limpieza auditada"
            echo
            echo "- Confirmación validada: ELIMINAR_44_ELEMENTOS"
            echo "- Rutas explícitas comprobadas: 33"
            echo "- Carpeta regenerable incluida: tools/__pycache__/"
            echo "- Excel, CMS y workflows vigentes: sin cambios"
          } >> "$GITHUB_STEP_SUMMARY"
