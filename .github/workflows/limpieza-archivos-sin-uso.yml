name: Limpiar archivos sin uso comprobado

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Primero audita; borra únicamente con confirmación exacta"
        required: true
        default: "AUDITAR"
        type: choice
        options:
          - AUDITAR
          - BORRAR_CONFIRMADO
      confirmacion:
        description: "Para borrar escribe: ELIMINAR_ARCHIVOS_HUERFANOS"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: limpieza-segura-distrito-goo
  cancel-in-progress: false

jobs:
  limpieza:
    if: github.repository == 'sbx-mx/Distrito_Goo'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Auditar sin borrar
        run: python tools/cleanup_unused.py --report reports/unused-files.json

      - name: Validar antes de la limpieza
        run: python tools/quality_gate.py --report reports/quality-gate-before-cleanup.json

      - name: Comprobar autorización de borrado
        if: inputs.accion == 'BORRAR_CONFIRMADO'
        shell: bash
        env:
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMACION" != "ELIMINAR_ARCHIVOS_HUERFANOS" ]; then
            echo "Confirmación inválida. No se eliminó ningún archivo."
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "La eliminación solo está permitida desde main."
            exit 1
          fi

      - name: Eliminar candidatos confirmados
        if: inputs.accion == 'BORRAR_CONFIRMADO'
        run: >-
          python tools/cleanup_unused.py --apply
          --confirm ELIMINAR_ARCHIVOS_HUERFANOS
          --report reports/unused-files.json

      - name: Validar después de la limpieza
        if: inputs.accion == 'BORRAR_CONFIRMADO'
        shell: bash
        run: |
          set -euo pipefail
          python tools/quality_gate.py --report reports/quality-gate-after-cleanup.json
          find modules -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node tools/test_experience_v37.mjs --report reports/v42-compatibility.json
          node tools/test_enhancements_v42.mjs --report reports/v42-enhancements.json

      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-limpieza-${{ github.run_number }}
          path: |
            reports/unused-files.json
            reports/quality-gate-before-cleanup.json
            reports/quality-gate-after-cleanup.json
            reports/v42-compatibility.json
            reports/v42-enhancements.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar limpieza validada
        if: inputs.accion == 'BORRAR_CONFIRMADO' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          deleted_count="$(python -c "import json; print(len(json.load(open('reports/unused-files.json', encoding='utf-8'))['deleted']))")"
          if [ "$deleted_count" = "0" ]; then
            echo "No se detectaron archivos seguros para eliminar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar archivos sin uso comprobado"
          git push
          echo "Se eliminaron $deleted_count archivos; Git conserva el historial recuperable." >> "$GITHUB_STEP_SUMMARY"
