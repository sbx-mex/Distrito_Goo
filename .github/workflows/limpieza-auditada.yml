name: Limpieza auditada de Distrito Goo

on:
  workflow_run:
    workflows:
      - Automatizar CMS de Distrito Goo
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limpieza-auditada-distrito-goo
  cancel-in-progress: false

jobs:
  limpiar:
    name: Respaldar y eliminar rutas autorizadas
    if: >-
      github.repository == 'sbx-mx/Distrito_Goo' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validar y extraer lista autorizada
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path, PurePosixPath

          source = Path("ARCHIVOS_ELIMINADOS.txt")
          output = Path("/tmp/rutas_autorizadas.txt")

          if not source.is_file():
              raise SystemExit("FALLO: falta ARCHIVOS_ELIMINADOS.txt en la raíz.")

          lines = source.read_text(encoding="utf-8-sig").splitlines()
          paths = []

          for index, line in enumerate(lines[:-1]):
              candidate = line.strip()
              next_line = lines[index + 1].strip()
              if candidate and next_line.startswith("Motivo:"):
                  paths.append(candidate)

          if not paths:
              raise SystemExit("FALLO: la lista auditada no contiene rutas.")

          if len(set(paths)) != len(paths):
              raise SystemExit("FALLO: la lista contiene rutas duplicadas.")

          protected_exact = {
              ".",
              "..",
              ".git",
              ".github",
              ".nojekyll",
              "ARCHIVOS_ELIMINADOS.txt",
              "BUILD.md",
              "README.md",
              "Distrito_Go_CMS_v2_actualizado.xlsx",
              "index.html",
              "manifest.json",
              "requirements.txt",
              "sw.js",
          }
          protected_prefixes = (
              ".git/",
              ".github/",
              "modules/",
              "styles/",
              "tools/",
              "data/",
              "assets/icons/",
              "assets/premium/duty-roster/",
          )

          for value in paths:
              path = PurePosixPath(value)
              invalid = (
                  value.startswith("/")
                  or "\\" in value
                  or "*" in value
                  or "?" in value
                  or "[" in value
                  or "]" in value
                  or any(part in {"", ".", ".."} for part in path.parts)
                  or value in protected_exact
                  or value.startswith(protected_prefixes)
              )
              if invalid:
                  raise SystemExit(f"FALLO: ruta no permitida: {value}")

          output.write_text("\n".join(paths) + "\n", encoding="utf-8")
          print(f"Lista autorizada validada: {len(paths)} rutas.")
          PY

      - name: Crear respaldo recuperable
        shell: bash
        run: |
          set -euo pipefail

          existing="$(
            while IFS= read -r path; do
              if git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
                echo "$path"
                break
              fi
            done < /tmp/rutas_autorizadas.txt
          )"
          if [ -z "$existing" ]; then
            echo "No quedan rutas auditadas por eliminar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          backup_branch="respaldo-antes-limpieza-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${backup_branch}"
          echo "Rama de respaldo creada: ${backup_branch}" >> "$GITHUB_STEP_SUMMARY"

      - name: Eliminar únicamente las rutas autorizadas
        shell: bash
        run: |
          set -euo pipefail

          removed=0
          already_absent=0

          while IFS= read -r path; do
            if git ls-files -- "$path" | grep -q .; then
              git rm -r --ignore-unmatch -- "$path"
              removed=$((removed + 1))
            else
              echo "Ya no existe: $path"
              already_absent=$((already_absent + 1))
            fi
          done < /tmp/rutas_autorizadas.txt

          if ! git diff --cached --diff-filter=ACMRTUXB --quiet; then
            echo "FALLO: se detectó un cambio que no es una eliminación."
            git diff --cached --name-status
            exit 1
          fi

          echo "Rutas eliminadas en esta ejecución: ${removed}" >> "$GITHUB_STEP_SUMMARY"
          echo "Rutas que ya no estaban presentes: ${already_absent}" >> "$GITHUB_STEP_SUMMARY"

          if git diff --cached --quiet; then
            echo "No quedan archivos auditados por eliminar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Guardar limpieza en main
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "Sin cambios pendientes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Eliminar archivos obsoletos auditados"
          git push origin "HEAD:main"
