name: Retirar contenido expirado

on:
  schedule:
    - cron: "20 12 * * 1"
  workflow_dispatch:
    inputs:
      accion:
        description: "Auditar o retirar contenido expirado"
        required: true
        default: "AUDITAR"
        type: choice
        options: [AUDITAR, RETIRAR_CONFIRMADO]
      confirmacion:
        description: "Para retirar escribe: RETIRAR_CONTENIDO_EXPIRADO"
        required: false
        type: string
      dias_gracia:
        description: "Días de gracia después de la fecha fin"
        required: true
        default: "7"
        type: string

permissions:
  contents: write

concurrency:
  group: limpieza-contenido-expirado-distrito-goo
  cancel-in-progress: false

jobs:
  limpiar:
    if: github.repository == 'sbx-mx/Distrito_Goo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Auditar vigencias
        env:
          GRACE_DAYS: ${{ inputs.dias_gracia || '7' }}
        run: python tools/cleanup_expired.py Distrito_Go_CMS_v2_actualizado.xlsx --grace-days "$GRACE_DAYS" --report reports/expired-content.json
      - name: Validar autorización
        if: inputs.accion == 'RETIRAR_CONFIRMADO'
        env:
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          test "$CONFIRMACION" = "RETIRAR_CONTENIDO_EXPIRADO"
      - name: Retirar filas vencidas
        if: inputs.accion == 'RETIRAR_CONFIRMADO'
        env:
          GRACE_DAYS: ${{ inputs.dias_gracia || '7' }}
        run: >-
          python tools/cleanup_expired.py Distrito_Go_CMS_v2_actualizado.xlsx
          --grace-days "$GRACE_DAYS" --apply --confirm RETIRAR_CONTENIDO_EXPIRADO
          --report reports/expired-content.json
      - name: Regenerar, retirar recursos huérfanos y validar
        if: inputs.accion == 'RETIRAR_CONFIRMADO'
        run: |
          set -euo pipefail
          python tools/build_data.py Distrito_Go_CMS_v2_actualizado.xlsx --project .
          python tools/cleanup_unused.py --apply --confirm ELIMINAR_ARCHIVOS_HUERFANOS --report reports/unused-files.json
          python tools/validate_cms.py Distrito_Go_CMS_v2_actualizado.xlsx --report reports/cms-validation.json
          python tools/validate_assets.py
          python tools/quality_gate.py --report reports/quality-gate-after-expiration.json
          node tools/test_wfm_events_v43.mjs
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigencias-${{ github.run_number }}
          path: |
            reports/expired-content.json
            reports/unused-files.json
            reports/quality-gate-after-expiration.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar retiro validado
        if: inputs.accion == 'RETIRAR_CONFIRMADO' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Distrito_Go_CMS_v2_actualizado.xlsx data assets reports
          git commit -m "Retirar contenido expirado validado"
          git push
