name: Mantenimiento seguro

on:
  schedule:
    - cron: "20 12 * * 1"
  workflow_dispatch:
    inputs:
      accion:
        description: "Auditar o ejecutar una fase confirmada"
        required: true
        default: AUDITAR
        type: choice
        options: [AUDITAR, RETIRAR_EXPIRADOS, ELIMINAR_HUERFANOS]
      confirmacion:
        description: "Escribe RETIRAR_CONTENIDO_EXPIRADO o ELIMINAR_ARCHIVOS_HUERFANOS"
        required: false
        type: string
      dias_gracia:
        description: "Días de gracia para contenido vencido"
        required: true
        default: "7"
        type: string

permissions:
  contents: write

concurrency:
  group: mantenimiento-seguro-distrito-goo
  cancel-in-progress: false

jobs:
  mantener:
    if: github.repository == 'sbx-mx/Distrito_Goo'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCION: ${{ inputs.accion || 'AUDITAR' }}
      CONFIRMACION: ${{ inputs.confirmacion || '' }}
      GRACE_DAYS: ${{ inputs.dias_gracia || '7' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci
      - name: Auditar contenido y archivos
        run: |
          python tools/cleanup_expired.py Distrito_Go_CMS_v2_actualizado.xlsx --grace-days "$GRACE_DAYS" --report reports/expired-content.json
          python tools/cleanup_unused.py --report reports/unused-files.json
      - name: Validar autorización
        if: env.ACCION != 'AUDITAR'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$ACCION" = "RETIRAR_EXPIRADOS" ]; then test "$CONFIRMACION" = "RETIRAR_CONTENIDO_EXPIRADO"; fi
          if [ "$ACCION" = "ELIMINAR_HUERFANOS" ]; then test "$CONFIRMACION" = "ELIMINAR_ARCHIVOS_HUERFANOS"; fi
      - name: Retirar contenido expirado confirmado
        if: env.ACCION == 'RETIRAR_EXPIRADOS'
        run: python tools/cleanup_expired.py Distrito_Go_CMS_v2_actualizado.xlsx --grace-days "$GRACE_DAYS" --apply --confirm RETIRAR_CONTENIDO_EXPIRADO --report reports/expired-content.json
      - name: Eliminar archivos huérfanos confirmados
        if: env.ACCION == 'ELIMINAR_HUERFANOS'
        run: python tools/cleanup_unused.py --apply --confirm ELIMINAR_ARCHIVOS_HUERFANOS --report reports/unused-files.json
      - name: Validar después de cualquier cambio
        if: env.ACCION != 'AUDITAR'
        run: python tools/cms_release.py Distrito_Go_CMS_v2_actualizado.xlsx --project .
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mantenimiento-${{ github.run_number }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar cambio confirmado
        if: env.ACCION != 'AUDITAR'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Distrito_Go_CMS_v2_actualizado.xlsx data assets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar mantenimiento seguro: $ACCION"
          git push
