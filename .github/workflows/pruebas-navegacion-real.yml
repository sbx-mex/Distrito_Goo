name: Probar navegación real

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "modules/**"
      - "styles/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "tools/test_navigation_e2e.mjs"
      - ".github/workflows/pruebas-navegacion-real.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navegacion-real-distrito-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navegador:
    name: Navegación en 320, 390, 768 y 1440 px
    if: github.repository == 'sbx-mx/Distrito_Goo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium
      - name: Iniciar sitio local
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/distrito-go-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/distrito-go-http.log
          exit 1
      - name: Ejecutar navegación real
        run: npm run test:navigation
