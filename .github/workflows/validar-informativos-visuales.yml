name: Validar informativos visuales

on:
  pull_request:
    paths:
      - "Distrito_Go_CMS_v2_actualizado.xlsx"
      - "data/informativo.v10.json"
      - "assets/photos/**"
      - "modules/experience.js"
      - "modules/operational.js"
      - "styles/navigation-v26.css"
      - "tools/validate_informative_visuals.py"
      - "tools/test_navigation_e2e.mjs"
      - ".github/workflows/validar-informativos-visuales.yml"
  push:
    branches: [main]
    paths:
      - "Distrito_Go_CMS_v2_actualizado.xlsx"
      - "data/informativo.v10.json"
      - "assets/photos/**"
      - "modules/experience.js"
      - "modules/operational.js"
      - "styles/navigation-v26.css"
      - "tools/validate_informative_visuals.py"
      - "tools/test_navigation_e2e.mjs"
      - ".github/workflows/validar-informativos-visuales.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: informativos-visuales-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Imágenes CMS visibles y navegables
    if: github.repository == 'sbx-mx/Distrito_Goo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditar referencias y reglas visuales
        run: python tools/validate_informative_visuals.py --report reports/informative-visuals.json
      - name: Validar sintaxis
        run: |
          node --check modules/experience.js
          node --check modules/operational.js
          node --check sw.js
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informativos-visuales-${{ github.run_number }}
          path: reports/informative-visuals.json
          if-no-files-found: error
          retention-days: 30
