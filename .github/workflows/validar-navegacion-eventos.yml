name: Validar navegación de eventos

on:
  pull_request:
    paths:
      - "Distrito_Go_CMS_v2_actualizado.xlsx"
      - "data/eventos.v10.json"
      - "assets/photos/**"
      - "modules/app.js"
      - "modules/experience.js"
      - "modules/operational.js"
      - "sw.js"
      - "tools/validate_event_navigation.py"
      - "tools/test_event_navigation_v45.mjs"
      - ".github/workflows/validar-navegacion-eventos.yml"
  push:
    branches: [main]
    paths:
      - "Distrito_Go_CMS_v2_actualizado.xlsx"
      - "data/eventos.v10.json"
      - "assets/photos/**"
      - "modules/app.js"
      - "modules/experience.js"
      - "modules/operational.js"
      - "sw.js"
      - "tools/validate_event_navigation.py"
      - "tools/test_event_navigation_v45.mjs"
      - ".github/workflows/validar-navegacion-eventos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventos-destinos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Destinos reales y comportamiento ECO
    if: github.repository == 'sbx-mx/Distrito_Goo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar referencias de eventos
        run: python tools/validate_event_navigation.py --report reports/event-navigation.json
      - name: Validar interacción y prioridad de destinos
        run: node tools/test_event_navigation_v45.mjs
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navegacion-eventos-${{ github.run_number }}
          path: reports/event-navigation.json
          if-no-files-found: error
          retention-days: 30
